version: 2

seeds:
  - name: raw_products
    description: >
      Five fictional small-molecule drug products. Names, codes, and all
      downstream data are synthetic — generated by
      scripts/generate_seed_data.py and used only to demonstrate the data
      model; they do not represent any real company or product.
    columns:
      - name: product_code
        data_tests:
          - unique
          - not_null

  - name: raw_batches
    description: One row per manufactured batch (lot).
    columns:
      - name: batch_id
        data_tests:
          - unique
          - not_null
      - name: product_code
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_products')
              field: product_code

  - name: raw_specifications
    description: >
      The release-testing specification (acceptance limits) for each
      product/test combination. A test may have a lower limit, an upper
      limit, or both.
    columns:
      - name: spec_id
        data_tests:
          - unique
          - not_null
      - name: product_code
        data_tests:
          - relationships:
              to: ref('raw_products')
              field: product_code

  - name: raw_qc_results
    description: One row per analytical test result recorded against a batch.
    columns:
      - name: result_id
        data_tests:
          - unique
          - not_null
      - name: batch_id
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_batches')
              field: batch_id
      - name: status
        data_tests:
          - accepted_values:
              values: ['Pass', 'OOS']

  - name: raw_deviations
    description: >
      Quality deviation records — some tied to a specific out-of-spec
      result, others logged against a batch for an unrelated process issue
      (equipment, sampling, documentation, environmental).
    columns:
      - name: deviation_id
        data_tests:
          - unique
          - not_null
      - name: batch_id
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_batches')
              field: batch_id
